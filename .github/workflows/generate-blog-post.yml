name: Generate Blog Post

on:
  schedule:
    - cron: '0 16 1 * *'   # 1st of month at 10am CST / 11am CDT (4pm UTC)
    - cron: '0 16 15 * *'  # 15th of month at 10am CST / 11am CDT (4pm UTC)
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_DRAFT_DOC_ID: ${{ secrets.BLOG_DRAFT_DOC_ID }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
          SITE_URL: https://growthmindsetparenting.com
        run: node scripts/generate-blog-post.mjs

      - name: Commit updated blog-queue.json
        run: |
          git config user.email "blog-generator@growthmindsetparenting.com"
          git config user.name "Blog Generator Bot"
          git add content/blog-queue.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          TITLE=$(node -e "const q=JSON.parse(require('fs').readFileSync('content/blog-queue.json','utf8')); const e=q.queue.find(x=>x.status==='generated'&&x.generatedAt); console.log(e?.title??'unknown')")
          git commit -m "Mark blog post generated: ${TITLE}"
          git push
